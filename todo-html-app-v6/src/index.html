<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>todos</title>

  <!-- === STYLES === -->
  <style>
    /* Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Base */
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    /* Card container */
    main {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      padding: 32px 28px 24px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: #c0392b;
      text-align: center;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
      opacity: 0.85;
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #new-todo {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      color: #333;
      transition: border-color 0.2s;
      outline: none;
    }

    #new-todo::placeholder {
      color: #aaa;
    }

    #new-todo:focus {
      border-color: #c0392b;
    }

    #add-btn {
      padding: 10px 18px;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #add-btn:hover {
      background: #a93226;
    }

    #add-btn:active {
      background: #922b21;
    }

    /* Todo list */
    #todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 1rem;
      color: #333;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item-text {
      flex: 1;
    }

    /* Tasks 2.1 & 2.2 — delete button: hidden by default, visible on hover/focus */
    .todo-delete {
      opacity: 0;
      background: none;
      border: none;
      color: #c0392b;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: opacity 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .todo-item:hover .todo-delete,
    .todo-item:focus-within .todo-delete {
      opacity: 1;
    }

    .todo-delete:hover {
      background: #fdecea;
    }

    /* Checkbox */
    .todo-check {
      width: 17px;
      height: 17px;
      margin-right: 10px;
      cursor: pointer;
      accent-color: #c0392b;
      flex-shrink: 0;
    }

    /* Completed item */
    .todo-item.completed .todo-item-text {
      text-decoration: line-through;
      color: #aaa;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
      padding: 24px 0 8px;
    }
  </style>
</head>
<body>

  <!-- === MARKUP === -->
  <main>
    <h1>todos</h1>

    <div class="input-row">
      <input
        type="text"
        id="new-todo"
        aria-label="New todo"
        placeholder="What needs to be done?"
        autocomplete="off"
      >
      <button id="add-btn">Add</button>
    </div>

    <ul id="todo-list"></ul>
  </main>

  <!-- === SCRIPT === -->
  <script>
    const STORAGE_KEY = 'todos-v1';

    // ── State ──────────────────────────────────────────────────────────────
    let todos = [];

    function createTodo(text) {
      return {
        id: crypto.randomUUID(),
        text: text.trim(),
        completed: false,
        createdAt: new Date().toISOString(),
      };
    }

    // ── Persistence ────────────────────────────────────────────────────────
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch { return []; }
    }

    // ── Render ─────────────────────────────────────────────────────────────
    // Tasks 1.1 & 1.2: render() creates .todo-item li with delete button
    function render() {
      const list = document.getElementById('todo-list');
      list.innerHTML = '';

      // Task 4.1: empty state when no todos
      if (todos.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-state';
        empty.textContent = 'No todos yet. Add one above!';
        list.appendChild(empty);
        return;
      }

      todos.forEach(todo => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.completed ? ' completed' : '');
        li.dataset.id = todo.id;

        // Task 2.1: checkbox before text
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'todo-check';
        checkbox.setAttribute('aria-label', 'Mark complete');
        checkbox.checked = todo.completed;

        const span = document.createElement('span');
        span.className = 'todo-item-text';
        span.textContent = todo.text;

        const btn = document.createElement('button');
        btn.className = 'todo-delete';
        btn.setAttribute('aria-label', 'Delete todo');
        btn.textContent = '×';

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    // ── Add handler ────────────────────────────────────────────────────────
    function addTodo() {
      const input = document.getElementById('new-todo');
      const text = input.value.trim();

      if (!text || text.length > 200) return;

      todos.push(createTodo(text));
      saveTodos();
      input.value = '';
      input.focus();
      render();
    }

    // ── List event delegation (delete + toggle) ───────────────────────────
    document.getElementById('todo-list').addEventListener('click', function (e) {
      const li = e.target.closest('.todo-item');
      if (!li) return;
      const id = li.dataset.id;

      // Delete
      if (e.target.matches('.todo-delete')) {
        todos = todos.filter(t => t.id !== id);
        saveTodos();
        li.remove();
        if (todos.length === 0) render();
        return;
      }

      // Toggle complete (Tasks 3.1–3.6)
      if (e.target.matches('.todo-check')) {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;
        todo.completed = !todo.completed;       // 3.3 toggle in array
        saveTodos();                             // 3.4 persist
        li.classList.toggle('completed', todo.completed);  // 3.5 DOM class
        e.target.checked = todo.completed;      // 3.6 sync checkbox
      }
    });

    // ── Event listeners ────────────────────────────────────────────────────
    document.getElementById('new-todo').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addTodo();
    });

    document.getElementById('add-btn').addEventListener('click', addTodo);

    // ── Init ───────────────────────────────────────────────────────────────
    todos = loadTodos();
    render();
  </script>

</body>
</html>
